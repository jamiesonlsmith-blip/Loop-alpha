<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Loop Alpha</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial;color:#17221b;background:#f7f5ed}.hero{min-height:100vh;background:linear-gradient(#fff9,#fff8),url('https://tile.openstreetmap.org/12/1100/1640.png');background-size:cover;background-attachment:fixed;padding:24px}.top{display:flex;align-items:center;gap:16px;max-width:900px;margin:auto}.menu{font-size:28px;background:#fff;border:0;border-radius:14px;padding:10px 14px;box-shadow:0 6px 20px #0002}.logo{font-size:32px;font-weight:900;color:#15803d}.tag{font-size:13px;color:#666}.search{max-width:760px;margin:90px auto 20px;background:#fff;border-radius:24px;padding:12px;box-shadow:0 15px 45px #0002;display:flex}.search input{flex:1;border:0;outline:0;font-size:17px;padding:12px}.search button{border:0;border-radius:16px;background:#e53935;color:#fff;font-weight:800;padding:0 20px}.chips,.cards{max-width:760px;margin:18px auto;display:flex;gap:10px;flex-wrap:wrap}.chip{background:#ffd54f;padding:9px 13px;border-radius:20px;font-weight:700}.card{background:#fff;padding:18px;border-radius:18px;box-shadow:0 8px 25px #0001;flex:1;min-width:220px}.rating{font-size:22px;font-weight:900;color:#15803d}.drawer{position:fixed;inset:0 auto 0 0;width:290px;background:#fff;padding:24px;transform:translateX(-105%);transition:.2s;z-index:3;box-shadow:8px 0 30px #0003}.drawer.open{transform:none}.drawer button{width:100%;padding:14px;margin:5px 0;text-align:left;border:0;background:#f5f5f5;border-radius:12px;font-weight:700}.home{background:#15803d!important;color:#fff}</style></head><body>
<div id="drawer" class="drawer"><h2>Loop</h2><button class="home" onclick="closeMenu()">⌂ Return to Home</button><button>👤 Profile</button><button>💬 Messages</button><button>♥ Saved Places</button><button>⚙ Settings</button></div>
<main class="hero"><div class="top"><button class="menu" onclick="openMenu()">☰</button><div><div class="logo">loop</div><div class="tag">Real places. Real experiences. Your Loop.</div></div></div>
<div class="search"><input id="q" placeholder="What are you looking for? Restaurants, parks, doctors..."><button onclick="search()">Search</button></div>
<div class="chips"><span class="chip">Restaurants</span><span class="chip">Medical</span><span class="chip">Parks</span><span class="chip">Home Services</span></div>
<div id="results" class="cards"><div class="card"><b>Discover inside your Loop</b><p>Search naturally and compare places using community experience, relevance and Loop Rating.</p></div><div class="card"><span class="rating">9.2</span><br><b>Loop Rating</b><p>Built from recent, trusted community experiences — not paid placement.</p></div></div></main>
<script>function openMenu(){drawer.classList.add('open')}function closeMenu(){drawer.classList.remove('open');scrollTo(0,0)}function search(){let q=document.getElementById('q').value||'places nearby';results.innerHTML='<div class="card"><span class="rating">8.9</span><br><b>Top match for '+q+'</b><p>Prototype search result • In your current Loop</p></div><div class="card"><span class="rating">8.5</span><br><b>Community favorite</b><p>Strong recent experiences • High confidence</p></div>'}</script></body></html>
