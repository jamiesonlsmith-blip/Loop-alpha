name: Place search regression tests
on:
  pull_request:
    paths:
      - 'api/places.js'
      - 'brain/loop-guide.js'
      - 'tests/loop-guide.test.mjs'
      - 'index.html'
      - 'sw.js'
      - 'updates/auto-update.js'
      - 'api/app-version.js'
      - 'tests/app-updates.test.mjs'
      - 'community/**'
      - 'supabase-communities.sql'
      - 'tests/communities.test.mjs'
      - 'tests/global-map.test.mjs'
      - 'tests/launcher-icon.test.mjs'
      - 'manifest.webmanifest'
      - 'icons/icon-*.png'
      - 'icons/loop-approved-source.b64'
      - 'scripts/build_loop_icons.py'
      - 'tests/navigation-back.test.mjs'
      - 'tests/place-search.test.mjs'
      - 'scripts/import_overture_places.py'
      - 'tests/test_overture_import.py'
      - '.github/workflows/place-search-tests.yml'
  push:
    branches: [main]
    paths:
      - 'api/places.js'
      - 'brain/loop-guide.js'
      - 'tests/loop-guide.test.mjs'
      - 'index.html'
      - 'sw.js'
      - 'updates/auto-update.js'
      - 'api/app-version.js'
      - 'tests/app-updates.test.mjs'
      - 'community/**'
      - 'supabase-communities.sql'
      - 'tests/communities.test.mjs'
      - 'tests/global-map.test.mjs'
      - 'tests/launcher-icon.test.mjs'
      - 'manifest.webmanifest'
      - 'icons/icon-*.png'
      - 'icons/loop-approved-source.b64'
      - 'scripts/build_loop_icons.py'
      - 'tests/place-search.test.mjs'
      - 'scripts/import_overture_places.py'
      - 'tests/test_overture_import.py'
jobs:
  search-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test search intent and place lookup
        run: node --test tests/*.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test Overture importer
        run: python -m unittest discover -s tests -p 'test_overture_import.py' -v
