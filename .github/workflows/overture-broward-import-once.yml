name: Overture Broward one-time secure import
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/overture-broward-import-once.yml'
      - 'scripts/import_overture_via_github_oidc.py'

permissions:
  contents: read
  id-token: write

concurrency:
  group: overture-broward-ingestion
  cancel-in-progress: false

jobs:
  import-broward:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test GeoJSONSeq importer
        run: python -m unittest discover -s tests -p 'test_overture_import.py' -v
      - name: Verify GitHub OIDC and Supabase storage guard BEFORE download
        run: python scripts/import_overture_via_github_oidc.py --preflight
      - name: Install official Overture client
        run: python -m pip install overturemaps
      - name: Download Broward Overture places
        run: |
          overturemaps download \
            --bbox=-80.53,25.94,-80.04,26.42 \
            --type=place -f geojsonseq \
            -o overture_broward.geojsonseq
      - name: Load verified records through scoped GitHub OIDC
        run: |
          python scripts/import_overture_via_github_oidc.py \
            --input overture_broward.geojsonseq
